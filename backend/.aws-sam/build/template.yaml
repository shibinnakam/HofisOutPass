AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Holy Family International School (HOFIS) - Student Outpass Management
  System
Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures:
    - x86_64
    Environment:
      Variables:
        STUDENTS_TABLE:
          Ref: StudentsTable
        OUTPASS_TABLE:
          Ref: OutpassTable
  Api:
    Cors:
      AllowMethods: '''GET,POST,PUT,OPTIONS'''
      AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
      AllowOrigin: '''*'''
Resources:
  StudentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Hofis_Students
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: admissionNumber
        AttributeType: S
      KeySchema:
      - AttributeName: admissionNumber
        KeyType: HASH
  OutpassTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Hofis_Outpasses
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: outpassId
        AttributeType: S
      - AttributeName: admissionNumber
        AttributeType: S
      - AttributeName: status
        AttributeType: S
      KeySchema:
      - AttributeName: outpassId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: AdmissionNumberIndex
        KeySchema:
        - AttributeName: admissionNumber
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      - IndexName: StatusIndex
        KeySchema:
        - AttributeName: status
          KeyType: HASH
        Projection:
          ProjectionType: ALL
  HofisUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: Hofis_Outpass_UserPool
      UsernameAttributes:
      - email
      AutoVerifiedAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
      - Name: name
        AttributeDataType: String
        Mutable: true
        Required: true
      - Name: role
        AttributeDataType: String
        Mutable: true
  HofisUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: Hofis_Outpass_WebClient
      UserPoolId:
        Ref: HofisUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_SRP_AUTH
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
  GetStudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetStudentFunction
      Handler: getStudent.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: StudentsTable
      Events:
        GetStudentApi:
          Type: Api
          Properties:
            Path: /students/{admissionNumber}
            Method: get
    Metadata:
      SamResourceId: GetStudentFunction
  CreateOutpassFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CreateOutpassFunction
      Handler: createOutpass.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: StudentsTable
      - DynamoDBWritePolicy:
          TableName:
            Ref: OutpassTable
      Events:
        CreateOutpassApi:
          Type: Api
          Properties:
            Path: /outpass
            Method: post
    Metadata:
      SamResourceId: CreateOutpassFunction
  ListOutpassesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ListOutpassesFunction
      Handler: listOutpasses.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: OutpassTable
      Events:
        ListOutpassesApi:
          Type: Api
          Properties:
            Path: /outpass
            Method: get
    Metadata:
      SamResourceId: ListOutpassesFunction
  UpdateOutpassFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: UpdateOutpassFunction
      Handler: updateOutpass.handler
      Policies:
      - DynamoDBWritePolicy:
          TableName:
            Ref: OutpassTable
      - Statement:
        - Effect: Allow
          Action:
          - ses:SendEmail
          - ses:SendRawEmail
          Resource: '*'
      Events:
        UpdateOutpassApi:
          Type: Api
          Properties:
            Path: /outpass/{outpassId}
            Method: put
    Metadata:
      SamResourceId: UpdateOutpassFunction
Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway base URL
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
  UserPoolId:
    Description: Cognito User Pool ID
    Value:
      Ref: HofisUserPool
  UserPoolClientId:
    Description: Cognito App Client ID
    Value:
      Ref: HofisUserPoolClient
  StudentsTableName:
    Description: DynamoDB Students Table Name
    Value:
      Ref: StudentsTable
  OutpassTableName:
    Description: DynamoDB Outpass Table Name
    Value:
      Ref: OutpassTable
